<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yacht 주사위</title>
<style>
:root{
  --bg:#f3efe6; --panel:#fffdf8; --ink:#1f2328; --muted:#6b6f76; --line:#e2dccf;
  --felt:#1f6b4f; --felt2:#185a42; --die:#fffefa; --pip:#1f2328; --pip-red:#c1121f;
  --accent:#c2410c; --accent-ink:#fff; --hold:#f59e0b; --good:#15803d; --bad:#b91c1c; --row-hi:#fff4e0;
  --st-online:#2563eb; --st-lobby:#a21caf; --st-game:#15803d; --st-off:#8b8f96;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --panel:#1e2125; --ink:#e8e6e1; --muted:#9aa0a6; --line:#33373d;
    --accent:#f97316; --accent-ink:#1b1b1b; --hold:#fbbf24; --good:#4ade80; --bad:#f87171; --row-hi:#2c261c;
    --st-online:#60a5fa; --st-lobby:#e879f9; --st-game:#4ade80; --st-off:#80868d;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1e2125; --ink:#e8e6e1; --muted:#9aa0a6; --line:#33373d;
  --accent:#f97316; --accent-ink:#1b1b1b; --hold:#fbbf24; --good:#4ade80; --bad:#f87171; --row-hi:#2c261c;
  --st-online:#60a5fa; --st-lobby:#e879f9; --st-game:#4ade80; --st-off:#80868d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,"Segoe UI","Malgun Gothic",sans-serif}
#app{min-height:100vh}
.reduce-motion *,.reduce-motion *::before,.reduce-motion *::after{animation:none!important;transition:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 430px;gap:16px}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:15px;margin:0 0 8px}
h3{font-size:14px;margin:14px 0 6px;color:var(--muted);font-weight:600}
.sub{color:var(--muted);font-size:13px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.iconbar{display:flex;gap:6px;flex-wrap:wrap}
.iconbtn{font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:6px 10px;cursor:pointer;position:relative}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn .dot{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:11px;line-height:16px;text-align:center;padding:0 4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.table{background:radial-gradient(circle at 50% 40%,var(--felt),var(--felt2));border-radius:14px;padding:20px 16px;color:#f4f1ea;min-height:320px;display:flex;flex-direction:column;gap:14px}
.status{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.turn{font-weight:700;font-size:18px}
.pill{background:rgba(0,0,0,.25);border-radius:999px;padding:4px 10px;font-size:13px;white-space:nowrap}
.pill.warn{background:var(--bad);color:#fff}
.dice{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:10px 0}
.die{width:64px;height:64px;border-radius:12px;background:var(--die);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9px;border:none;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .15s}
.die:disabled{cursor:default}
.die.held{outline:4px solid var(--hold);transform:translateY(6px)}
.die.blank{opacity:.35}
.die.rolling{animation:shake .45s ease}
@keyframes shake{0%{transform:rotate(0)}25%{transform:rotate(-18deg) translateY(-8px)}50%{transform:rotate(14deg)}75%{transform:rotate(-8deg) translateY(-4px)}100%{transform:rotate(0)}}
.pip{width:11px;height:11px;border-radius:50%;background:var(--pip);align-self:center;justify-self:center;visibility:hidden}
.pip.on{visibility:visible}
.die[data-v="1"] .pip.on,.die[data-v="4"] .pip.on{background:var(--pip-red)}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button.btn{font:inherit;border:none;border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-weight:600}
button.btn.ghost{background:rgba(255,255,255,.15);color:#f4f1ea}
button.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.btn.small{padding:6px 12px;font-size:13px}
button.btn.tiny{padding:4px 9px;font-size:12px;border-radius:8px}
button.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{text-align:center;font-size:13px;opacity:.9;min-height:18px}
.banner{align-self:center;font-weight:800;letter-spacing:.06em;font-size:28px;color:var(--hold);text-shadow:0 2px 0 rgba(0,0,0,.35);height:36px}
.banner.show{animation:pop .9s ease}
@keyframes pop{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.emojis{display:flex;gap:6px;justify-content:center}
.emojis button{font-size:20px;background:rgba(255,255,255,.12);border:none;border-radius:8px;padding:2px 8px;cursor:pointer}
table.sheet{width:100%;border-collapse:collapse;font-size:14px}
.sheet th,.sheet td{border-bottom:1px solid var(--line);padding:6px 5px;text-align:center}
.sheet th:first-child,.sheet td:first-child{text-align:left;white-space:nowrap}
.sheet thead th{font-size:13px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet thead th.active{color:var(--accent)}
.sheet thead th.off{color:var(--muted);text-decoration:line-through}
.sheet td.cell{min-width:48px}
.sheet td.preview{cursor:pointer;color:var(--muted);font-style:italic}
.sheet td.preview:hover,.sheet td.preview:focus{background:var(--row-hi);color:var(--ink);outline:none}
.sheet td.preview.nz{color:var(--accent);font-weight:600}
.sheet td.fresh{background:var(--row-hi)}
.sheet tr.sum td{font-weight:600;background:color-mix(in srgb,var(--line) 35%,transparent)}
.sheet tr.grand td{font-weight:800;font-size:15px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{flex:1;font:inherit;font-size:14px;padding:8px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.form{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center}
.row > .grow,.grow{flex:1;min-width:0}
input,select{font:inherit;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
input[type=range]{padding:0;accent-color:var(--accent)}
input[type=color]{padding:2px;width:44px;height:32px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.seat{display:grid;grid-template-columns:22px 1fr 92px 32px;gap:6px;align-items:center}
.seat .num{color:var(--muted);font-size:13px}
.x{font:inherit;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;height:34px;cursor:pointer}
.list{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-radius:10px;max-height:260px;overflow:auto}
.list li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:none}
.list .empty{color:var(--muted);justify-content:center}
.tag{font-size:12px;border-radius:999px;padding:2px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ok{color:var(--good);border-color:var(--good)}
.tag.host{color:var(--accent);border-color:var(--accent)}
.code{font:700 26px/1 ui-monospace,Consolas,monospace;letter-spacing:.2em}
.mono{font-family:ui-monospace,Consolas,monospace;letter-spacing:.08em}
.err{color:var(--bad);font-size:13px;min-height:18px}
.muted{color:var(--muted);font-size:13px}
/* modals */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.overlay.show{display:flex}
.overlay > .card{max-width:360px;width:100%;max-height:calc(100vh - 32px);overflow:auto}
.overlay > .card.wide{max-width:560px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-head h1{margin:0}
.close{font:inherit;font-size:20px;line-height:1;border:none;background:transparent;color:var(--muted);cursor:pointer;padding:4px 8px}
.setrow{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;min-height:36px}
.setrow .val{text-align:right;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.setrow.two{grid-template-columns:130px 1fr}
.keybtn{font:600 13px ui-monospace,Consolas,monospace;min-width:110px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.keybtn.wait{border-color:var(--accent);color:var(--accent)}
.friend .name{font-weight:600}
.friend .st{font-size:12px}
.st-offline{color:var(--st-off)} .st-online{color:var(--st-online)} .st-lobby{color:var(--st-lobby)} .st-game{color:var(--st-game)}
.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:8px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar > span{display:block;height:100%;background:var(--accent)}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
@media (max-width:480px){.statgrid{grid-template-columns:repeat(2,1fr)}}
.stat{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:20px}
.ach{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ach .ic{font-size:22px;width:30px;text-align:center;filter:grayscale(1);opacity:.4}
.ach.on .ic{filter:none;opacity:1}
.ach .t{font-weight:600}
.rank{list-style:none;padding:0;margin:12px 0}
.rank li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.rank li:first-child{font-weight:700;color:var(--good)}
.help table{border-collapse:collapse;width:100%;font-size:14px}
.help td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:top}
.help td:last-child{color:var(--muted)}
kbd{font:600 12px ui-monospace,Consolas,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--bg)}
.log{font-size:12px;color:var(--muted);max-height:96px;overflow:auto;margin-top:8px}
.toast{position:fixed;right:16px;bottom:16px;z-index:20;max-width:340px;width:calc(100% - 32px)}
.toast .card{box-shadow:0 8px 30px rgba(0,0,0,.25);margin-top:8px}
.float-emoji{position:fixed;font-size:42px;pointer-events:none;animation:floatUp 1.6s ease forwards;z-index:15}
@keyframes floatUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-120px)}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
<div class="wrap">
  <section>
    <div class="topbar">
      <div>
        <h1 data-i18n="title">Yacht 주사위</h1>
        <div class="sub" data-i18n="subtitle"></div>
      </div>
      <nav class="iconbar" aria-label="menu">
        <button class="iconbtn" id="btnFriends">👥 <span data-i18n="friends">친구</span><span class="dot" id="inviteDot" hidden></span></button>
        <button class="iconbtn" id="btnStats">🏆 <span data-i18n="stats">전적</span></button>
        <button class="iconbtn" id="btnHelp">❔ <span data-i18n="help">도움말</span></button>
        <button class="iconbtn" id="btnSettings">⚙️ <span data-i18n="settings">설정</span></button>
      </nav>
    </div>
    <div class="table">
      <div class="status">
        <span class="turn" id="turn"></span>
        <span>
          <span class="pill" id="timer" hidden></span>
          <span class="pill" id="round"></span>
          <span class="pill" id="rolls"></span>
        </span>
      </div>
      <div class="banner" id="banner"></div>
      <div class="dice" id="dice"></div>
      <div class="controls">
        <button class="btn" id="rollBtn" disabled></button>
        <button class="btn ghost" id="releaseBtn" hidden></button>
        <button class="btn ghost" id="quitBtn" hidden data-i18n="quit"></button>
      </div>
      <div class="hint" id="hint"></div>
      <div class="emojis" id="emojis" hidden></div>
    </div>
    <div class="log" id="log"></div>
  </section>

  <aside class="card">
    <!-- setup -->
    <div id="setup">
      <div class="tabs" role="tablist">
        <button id="tabLocal" class="on" role="tab" data-i18n="tabLocal"></button>
        <button id="tabOnline" role="tab" data-i18n="tabOnline"></button>
      </div>

      <div id="localPane" class="form">
        <div class="muted" data-i18n="localDesc"></div>
        <div id="seats" class="form"></div>
        <div class="row">
          <button class="btn sec small" id="addSeat" data-i18n="addSeat"></button>
          <span class="grow"></span>
          <label class="muted"><span data-i18n="aiSpeed"></span>
            <select id="speedIn">
              <option value="900" data-i18n="slow"></option><option value="550" data-i18n="normal"></option><option value="200" data-i18n="fast"></option>
            </select>
          </label>
        </div>
        <button class="btn" id="startLocal" data-i18n="startGame"></button>
      </div>

      <div id="onlinePane" class="form" hidden>
        <div id="connectBox" class="form">
          <label class="muted" for="serverIn" data-i18n="serverAddr"></label>
          <input id="serverIn" placeholder="192.168.0.10:3000">
          <label class="muted" for="onlineName" data-i18n="myName"></label>
          <input id="onlineName" maxlength="12">
          <button class="btn" id="connectBtn" data-i18n="connect"></button>
          <div class="muted" data-i18n="seeReadme"></div>
        </div>

        <div id="browseBox" class="form" hidden>
          <div class="row"><span class="grow muted" id="connInfo"></span><button class="btn sec small" id="disconnectBtn" data-i18n="disconnect"></button></div>
          <button class="btn" id="quickBtn" data-i18n="quickMatch"></button>
          <h2 data-i18n="createRoom"></h2>
          <div class="row">
            <input id="roomName" class="grow" maxlength="12" data-i18n-ph="roomNamePh">
            <select id="createTimer" data-i18n-title="turnLimit">
              <option value="0" data-i18n="noLimit"></option><option value="30">30s</option>
              <option value="60" selected>60s</option><option value="90">90s</option>
            </select>
          </div>
          <button class="btn sec" id="createBtn" data-i18n="createRoom"></button>
          <h2 style="margin-top:6px" data-i18n="joinByCode"></h2>
          <div class="row">
            <input id="codeIn" class="grow" maxlength="4" data-i18n-ph="codePh" style="text-transform:uppercase">
            <button class="btn small" id="joinBtn" data-i18n="join"></button>
          </div>
          <div class="row"><h2 class="grow" style="margin:6px 0 0" data-i18n="openRooms"></h2><button class="btn sec small" id="refreshBtn" data-i18n="refresh"></button></div>
          <ul class="list" id="roomList"></ul>
        </div>

        <div id="lobbyBox" class="form" hidden>
          <div class="row">
            <div class="grow"><div class="muted" data-i18n="roomCode"></div><div class="code" id="lobbyCode"></div></div>
            <button class="btn sec small" id="inviteFromLobby" data-i18n="inviteFriends"></button>
            <button class="btn sec small" id="leaveBtn" data-i18n="leave"></button>
          </div>
          <div class="muted" id="lobbyName"></div>
          <ul class="list" id="memberList"></ul>
          <label class="row muted"><span data-i18n="turnLimit"></span>
            <select id="lobbyTimer" class="grow">
              <option value="0" data-i18n="noLimit"></option><option value="30">30s</option><option value="60">60s</option><option value="90">90s</option>
            </select>
          </label>
          <button class="btn" id="readyBtn"></button>
          <button class="btn" id="startOnline" hidden data-i18n="startGame"></button>
          <div class="muted" id="lobbyHint"></div>
        </div>
        <div class="err" id="err"></div>
      </div>
    </div>

    <div id="board" hidden><table class="sheet" id="sheet"></table></div>
  </aside>
</div>
</div>

<!-- game over -->
<div class="overlay" id="over">
  <div class="card">
    <h1 id="overTitle"></h1>
    <ol class="rank" id="rank"></ol>
    <div class="row">
      <button class="btn" id="againBtn" data-i18n="again"></button>
      <button class="btn sec" id="closeOver" data-i18n="close"></button>
    </div>
    <div class="muted" id="overHint"></div>
  </div>
</div>

<!-- settings (UISetting) -->
<div class="overlay" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="card wide">
    <div class="modal-head"><h1 id="setTitle" data-i18n="settings"></h1><button class="close" data-close aria-label="close">✕</button></div>
    <div class="tabs" id="setTabs">
      <button data-tab="general" class="on" data-i18n="setGeneral"></button>
      <button data-tab="sound" data-i18n="setSound"></button>
      <button data-tab="display" data-i18n="setDisplay"></button>
      <button data-tab="keys" data-i18n="setKeys"></button>
    </div>

    <div data-pane="general" class="form">
      <div class="setrow two"><label for="setLang" data-i18n="language"></label>
        <select id="setLang"><option value="ko">한국어</option><option value="en">English</option></select></div>
      <div class="setrow two"><label for="setTheme" data-i18n="theme"></label>
        <select id="setTheme"><option value="system" data-i18n="themeSystem"></option><option value="light" data-i18n="themeLight"></option><option value="dark" data-i18n="themeDark"></option></select></div>
      <div class="setrow two"><label for="setTips" data-i18n="showTips"></label><input type="checkbox" id="setTips"></div>
      <div class="setrow two"><label for="setMotion" data-i18n="reduceMotion"></label><input type="checkbox" id="setMotion"></div>
      <div class="setrow two"><label for="setConfirm" data-i18n="confirmZero"></label><input type="checkbox" id="setConfirm"></div>
    </div>

    <div data-pane="sound" class="form" hidden>
      <div class="setrow"><label for="volMaster" data-i18n="volMaster"></label><input type="range" id="volMaster" min="0" max="100"><span class="val" id="volMasterV"></span></div>
      <div class="setrow"><label for="volMusic" data-i18n="volMusic"></label><input type="range" id="volMusic" min="0" max="100"><span class="val" id="volMusicV"></span></div>
      <div class="setrow"><label for="volUi" data-i18n="volUi"></label><input type="range" id="volUi" min="0" max="100"><span class="val" id="volUiV"></span></div>
      <div class="setrow"><label for="volSfx" data-i18n="volSfx"></label><input type="range" id="volSfx" min="0" max="100"><span class="val" id="volSfxV"></span></div>
      <div class="setrow two"><label for="setMute" data-i18n="muteAll"></label><input type="checkbox" id="setMute"></div>
      <div class="row"><button class="btn sec small" id="testSound" data-i18n="testSound"></button></div>
    </div>

    <div data-pane="display" class="form" hidden>
      <div class="setrow"><label for="dispBright" data-i18n="brightness"></label><input type="range" id="dispBright" min="50" max="150"><span class="val" id="dispBrightV"></span></div>
      <div class="setrow"><label for="dispSat" data-i18n="saturation"></label><input type="range" id="dispSat" min="0" max="200"><span class="val" id="dispSatV"></span></div>
      <div class="setrow"><label for="dispContrast" data-i18n="contrast"></label><input type="range" id="dispContrast" min="50" max="150"><span class="val" id="dispContrastV"></span></div>
      <h3 data-i18n="customize"></h3>
      <div class="setrow two"><label for="colTable" data-i18n="colTable"></label><input type="color" id="colTable"></div>
      <div class="setrow two"><label for="colDice" data-i18n="colDice"></label><input type="color" id="colDice"></div>
      <div class="setrow two"><label for="colPip" data-i18n="colPip"></label><input type="color" id="colPip"></div>
      <div class="setrow two"><label for="colPipRed" data-i18n="colPipRed"></label><input type="color" id="colPipRed"></div>
      <div class="row"><button class="btn sec small" id="resetColors" data-i18n="resetColors"></button></div>
    </div>

    <div data-pane="keys" class="form" hidden>
      <div class="muted" data-i18n="keysDesc"></div>
      <div id="keyRows" class="form"></div>
    </div>

    <div class="row" style="margin-top:16px">
      <button class="btn danger small" id="resetAll" data-i18n="resetAll"></button>
      <span class="grow"></span>
      <button class="btn small" data-close data-i18n="close"></button>
    </div>
  </div>
</div>

<!-- friends (MainUIFriendsManager) -->
<div class="overlay" id="friendsModal" role="dialog" aria-modal="true" aria-labelledby="frTitle">
  <div class="card wide">
    <div class="modal-head"><h1 id="frTitle" data-i18n="friends"></h1><button class="close" data-close aria-label="close">✕</button></div>
    <div id="frOffline" class="muted" data-i18n="friendsNeedServer"></div>
    <div id="frMine" class="row" hidden>
      <span class="grow muted"><span data-i18n="myFriendCode"></span> <b class="mono" id="myCode"></b></span>
      <button class="btn sec tiny" id="copyCode" data-i18n="copy"></button>
    </div>
    <div class="tabs" id="frTabs" style="margin-top:10px">
      <button data-tab="list" class="on" data-i18n="friendList"></button>
      <button data-tab="users" data-i18n="serverUsers"></button>
    </div>
    <div data-pane="list" class="form">
      <div class="row">
        <input id="frSearch" class="grow" data-i18n-ph="searchFriend">
      </div>
      <ul class="list" id="frList"></ul>
      <div class="pager"><button class="btn sec tiny" id="frPrev">◀</button><span id="frPage" class="muted">1/1</span><button class="btn sec tiny" id="frNext">▶</button></div>
      <div class="row">
        <input id="frAddCode" class="grow mono" maxlength="6" data-i18n-ph="addByCode" style="text-transform:uppercase">
        <input id="frAddName" class="grow" maxlength="12" data-i18n-ph="nickname">
        <button class="btn small" id="frAdd" data-i18n="add"></button>
      </div>
    </div>
    <div data-pane="users" class="form" hidden>
      <div class="muted" data-i18n="serverUsersDesc"></div>
      <ul class="list" id="userList"></ul>
    </div>
    <div class="err" id="frErr"></div>
  </div>
</div>

<!-- stats (MainUIState + MySteamAchievement) -->
<div class="overlay" id="statsModal" role="dialog" aria-modal="true" aria-labelledby="stTitle">
  <div class="card wide">
    <div class="modal-head"><h1 id="stTitle" data-i18n="stats"></h1><button class="close" data-close aria-label="close">✕</button></div>
    <div class="statgrid" id="statGrid"></div>
    <div class="form">
      <div><div class="row"><span class="grow" data-i18n="winsTo100"></span><span class="muted" id="winBarV"></span></div><div class="bar"><span id="winBar"></span></div></div>
      <div><div class="row"><span class="grow" data-i18n="yachtsTo100"></span><span class="muted" id="yachtBarV"></span></div><div class="bar"><span id="yachtBar"></span></div></div>
    </div>
    <h3 data-i18n="achievements"></h3>
    <div id="achList"></div>
    <div class="muted" style="margin-top:10px" data-i18n="statsNote"></div>
    <div class="row" style="margin-top:12px"><button class="btn danger small" id="resetStats" data-i18n="resetStats"></button></div>
  </div>
</div>

<!-- help (ControllerHelper / help) -->
<div class="overlay" id="helpModal" role="dialog" aria-modal="true" aria-labelledby="hpTitle">
  <div class="card wide help">
    <div class="modal-head"><h1 id="hpTitle" data-i18n="help"></h1><button class="close" data-close aria-label="close">✕</button></div>
    <div id="helpBody"></div>
  </div>
</div>

<div class="toast" id="toasts" aria-live="polite"></div>

<script src="i18n.js"></script>
<script src="prefs.js"></script>
<script src="sound.js"></script>
<script src="yacht-core.js"></script>
<script src="yacht-game.js"></script>
<script src="app.js"></script>
</body>
</html>
